<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>LaTale - An Exciting and Amazing Story</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Path of Choice">
  <meta property="og:description" content="The Prelude of Destiny starting with the Breath of the Earth">
  <meta property="og:image" content="img/og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/global-hub.css">
</head>

<body>
  <!-- Global Hub Portal Navigation Bar -->
  <div id="global-hub-nav">
    <div class="hub-logo">
      <a href="https://latale.papayaplay.com/latale.do" target="_self">
        <img src="img/logo_papaya.png" alt="Papaya Play" />
      </a>
    </div>
    <div class="hub-menu">
      <a href="../update1/index.html" class="hub-link">Devil's Whisper</a>
      <span class="hub-divider">/</span>
      <a href="../update2/index.html" class="hub-link active-update2">Path of Choice</a>
    </div>
  </div>

  <!-- ============================================================
       VUE TEMPLATES (script type=text/x-template)
       ============================================================ -->

  <!-- ROOT APP -->
  <script type="text/x-template" id="tpl-app">
    <div id="wrap">
      <layout-wrap></layout-wrap>
    </div>
  </script>

  <!-- LAYOUT WRAP -->
  <script type="text/x-template" id="tpl-layout-wrap">
    <div class="layout-wrap">
      <layout-header-mobile v-if="isMobile && headerView"></layout-header-mobile>
      <layout-header v-else-if="headerView"></layout-header>
      <router-view></router-view>
      <layout-footer-mobile v-if="isMobile && footerView"></layout-footer-mobile>
      <layout-footer v-else-if="footerView"></layout-footer>
      <popup-overlay></popup-overlay>
    </div>
  </script>

  <!-- LAYOUT HEADER -->
  <script type="text/x-template" id="tpl-layout-header">
    <header id="header">
      <div class="header-wrap">
        <!-- Logo -->
        <h1 class="header-logo">
          <router-link to="/main" class="header-logo-link">Path of Choice</router-link>
        </h1>
        <!-- Main Navigation -->
        <nav class="header-navigation">
          <ul>
            <li>
              <router-link to="/system/3" class="nav-menu">Dungeon Point System</router-link>
            </li>
            <li>
              <router-link to="/system/1" class="nav-menu">Zodiac System</router-link>
            </li>
            <li>
              <router-link to="/system/2" class="nav-menu">Reputation System</router-link>
            </li>
          </ul>
        </nav>
        <!-- Page Menu Icons -->
        <nav class="header-page-menu">
          <ul>
            <li>
              <a class="icon-menu home text-hidden" href="https://latale.papayaplay.com/latale.do" target="_self">
                <span class="icon-ripple">Go to Official Website</span>
              </a>
            </li>
            <li>
              <button
                class="icon-menu music text-hidden"
                :class="{ playing: soundState }"
                type="button"
                @click="soundToggle"
              >
                <span class="icon-ripple">BGM</span>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </script>

  <!-- LAYOUT FOOTER -->
  <script type="text/x-template" id="tpl-layout-footer">
    <footer id="footer" :class="footerType">{{ footerHtml }}</footer>
  </script>

  <!-- LAYOUT HEADER MOBILE -->
  <script type="text/x-template" id="tpl-layout-header-mobile">
    <header id="header" class="mobile-header">
      <div class="header">
        <button class="menu-open text-hidden" type="button" @click="menuOpen = true">Open Menu</button>
        <h1 class="to-main">
          <router-link to="/main">Path of Choice</router-link>
        </h1>
        <a class="shortcut home text-hidden" href="https://latale.papayaplay.com/latale.do" target="_self">Go to Official Website</a>
      </div>
      <div v-if="menuOpen" class="aside-menu-back" @click="menuOpen = false"></div>
      <div class="aside-menu" :class="{ open: menuOpen }">
        <div class="user-menu">
          <button class="menu-close text-hidden" type="button" @click="menuOpen = false">Close Menu</button>
        </div>
        <nav class="mobile-navigation">
          <ul>
            <li>
              <router-link to="/system/3" class="menu">Dungeon Point System</router-link>
            </li>
            <li>
              <router-link to="/system/1" class="menu">Zodiac System</router-link>
            </li>
            <li>
              <router-link to="/system/2" class="menu">Reputation System</router-link>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </script>

  <!-- LAYOUT FOOTER MOBILE -->
  <script type="text/x-template" id="tpl-layout-footer-mobile">
    <footer id="footer" class="mobile-footer" :class="footerType">{{ footerHtml }}</footer>
  </script>

  <!-- POPUP -->
  <script type="text/x-template" id="tpl-popup">
    <transition name="popup">
      <section
        v-if="popupFlag"
        class="popup-overlay"
        :class="{ 'popup-play': popupPlayFlag }"
        @click.self="closePopup"
      >
        <!-- Image Popup -->
        <template v-if="popupImageFlag">
          <h1 class="hide">View Image</h1>
          <div class="popup-body">
            <button class="popup-close-btn text-hidden-overflow" type="button" @click="closePopup">
              <span>Close</span>
            </button>
            <div class="popup-images" :class="popupImageClass && popupImageClass[0]">
              <div class="flicking-viewport">
                <div class="flicking-camera" :style="{ transform: 'translateX(-' + (currentIndex * 100) + '%)' }">
                  <div
                    v-for="(imgClass, idx) in popupImageClass"
                    :key="idx"
                    :class="imgClass"
                    style="flex-shrink:0; width:100%;"
                  ></div>
                </div>
              </div>
              <template v-if="hasMultipleImages">
                <button class="popup-arrow prev text-hidden-overflow" type="button" @click="prevImage">
                  <span>Previous</span>
                </button>
                <button class="popup-arrow next text-hidden-overflow" type="button" @click="nextImage">
                  <span>Next</span>
                </button>
              </template>
            </div>
          </div>
        </template>
        <!-- Video Popup -->
        <template v-if="popupPlayFlag">
          <h1 class="hide">Watch Video</h1>
          <div class="popup-body">
            <button class="popup-close-btn text-hidden-overflow" type="button" @click="closePopup">
              <span>Close</span>
            </button>
            <div class="popup-player" ref="youtubePlayer" id="youtube-player"></div>
          </div>
        </template>
      </section>
    </transition>
  </script>

  <!-- LEFT TITLE -->
  <script type="text/x-template" id="tpl-left-title">
    <h1 class="left-title system-left-title">
      <span class="left-title-inner">
        <span class="left-title-text">
          <slot></slot>
        </span>
      </span>
    </h1>
  </script>

  <!-- MAIN VIEW -->
  <script type="text/x-template" id="tpl-main-view">
    <div>
      <section v-if="isMobile" id="main-mobile" class="floating-child">
        <h1 class="title text-hidden" data-anim="zoom-out" data-anim-delay="200">Path of Choice</h1>
      </section>
      <section v-else id="main" class="floating-child">
        <div class="char-1 text-hidden" data-anim="slide-bottom" data-anim-delay="200">Promised Land Character 1</div>
        <div class="char-1-effect text-hidden">Effect 1</div>
        <div class="bg-cover-1 text-hidden">Background 1</div>
        <div class="char-2 text-hidden" data-anim="slide-left">Promised Land Character 2</div>
        <div class="char-2-effect text-hidden">Effect 2</div>
        <div class="bg-cover-2 text-hidden">Background 2</div>
        <div class="char-3-effect text-hidden">Effect 3</div>
        <div class="char-3 text-hidden" data-anim="slide-right">Promised Land Character 3</div>
        <div class="bg-cover-3 text-hidden">Background 3</div>
        <div class="bg-cover-4 text-hidden" data-anim="fade">Background 4</div>
        <div class="char-4 text-hidden" data-anim="fade">Promised Land Character 4</div>
        <div class="char-5 text-hidden" data-anim="slide-left">Promised Land Character 5</div>
        <div class="char-6 text-hidden" data-anim="slide-right">Promised Land Character 6</div>
        <div class="bg-cover-5 text-hidden" data-anim="fade">Background 5</div>
        <div class="bg-cover-6 text-hidden" data-anim="fade">Background 6</div>
        <h1 class="main-title text-hidden" data-anim="slide-bottom">Path of Choice</h1>
      </section>
    </div>
  </script>

  <!-- SYSTEM 1 VIEW (별자리 시스템 개선) -->
  <script type="text/x-template" id="tpl-system1-view">
    <section id="system-1">
      <div class="sys-page-inner">
        <h1 class="sys1-title sys-title-text" data-anim="slide-top">
          <span class="sys-title-deco">✦✦</span>
          Zodiac System Improvements
          <span class="sys-title-deco">✦✦</span>
        </h1>
        <div class="sys1-content-1 sys-content-block sys1-theme" data-anim="slide-top" data-anim-delay="200">
          <div class="sys-content-title-box">Zodiac Expansion</div>
          <ul class="sys-content-list">
            <li>The existing Growth / Lucky Zodiacs are classified as Ascension 1, and Ascension 2 Growth / Lucky Zodiacs are being added.</li>
            <li>Ascension 2 Zodiac Points accumulate and are spent separately from Ascension 1 points,<br>and can be converted using items dedicated to Ascension 2 Zodiac Points.</li>
          </ul>
        </div>
        <div class="sys1-content-2 sys-content-block sys1-theme" data-anim="slide-top" data-anim-delay="400">
          <div class="sys-content-title-box">Zodiac Improvements</div>
          <ul class="sys-content-list">
            <li>Easier to check the quantity of items that grant bonus points.</li>
            <li>Star imagery varies depending on whether the Growth / Lucky Zodiac is Ascension 1 or Ascension 2.</li>
            <li>When you select a stat in the Stats display panel, the corresponding star in the Zodiac is highlighted right away.</li>
          </ul>
          <div class="sys-content-image">
            <img :src="isMobile ? 'img/mobile/page/system/1/content_2.png' : 'img/web/page/system/1/content_2.png'" alt="Zodiac Improvements">
          </div>
        </div>
      </div>
    </section>
  </script>

  <!-- SYSTEM 2 VIEW (평판 시스템 리뉴얼) -->
  <script type="text/x-template" id="tpl-system2-view">
    <section id="system-2">
      <div class="sys-page-inner">
        <h1 class="sys2-title sys-title-text" data-anim="slide-top">
          <span class="sys-title-deco">✦✦</span>
          Reputation System Renewal
          <span class="sys-title-deco">✦✦</span>
        </h1>
        <div class="sys2-content-2 sys-table-block" data-anim="slide-top" data-anim-delay="200">
          <div class="sys-content-image" style="margin: 0 0 30px 0;">
            <img :src="isMobile ? 'img/mobile/page/system/2/content_1.png' : 'img/web/page/system/2/content_1.png'" alt="Reputation System Renewal">
          </div>
          <table class="sys-table sys2-theme">
            <colgroup>
              <col style="width:60px">
              <col style="width:200px">
              <col>
            </colgroup>
            <tbody>
              <tr>
                <td class="sys-table-num">1</td>
                <td class="sys-table-label">Unlock Condition</td>
                <td class="sys-table-desc">See the unlock level for each region's reputation. Reputation unlocks automatically once you reach the required level.</td>
              </tr>
              <tr>
                <td class="sys-table-num">2</td>
                <td class="sys-table-label">Levels & Stats</td>
                <td class="sys-table-desc">Reputation level, required values, and stat bonuses are now visible at a glance.</td>
              </tr>
              <tr>
                <td class="sys-table-num">3</td>
                <td class="sys-table-label">Exchange Item</td>
                <td class="sys-table-desc">View and exchange items available through that reputation directly via the button interface.</td>
              </tr>
              <tr>
                <td class="sys-table-num">4</td>
                <td class="sys-table-label">Travel</td>
                <td class="sys-table-desc">Travel directly to the representative NPC location for the selected reputation region.</td>
              </tr>
              <tr>
                <td class="sys-table-num">5</td>
                <td class="sys-table-label">Details</td>
                <td class="sys-table-desc">See details on reputation quests — active regions, dungeons, and how to earn points.</td>
              </tr>
            </tbody>
          </table>
          <p class="sys-table-notice">Some details may change at the time of the live update.</p>
        </div>
      </div>
    </section>
  </script>

  <!-- SYSTEM 3 VIEW (던전 포인트 시스템) -->
  <script type="text/x-template" id="tpl-system3-view">
    <section id="system-3">
      <div class="sys-page-inner">
        <h1 class="sys3-title sys-title-text" data-anim="slide-top">
          <span class="sys-title-deco">✦✦</span>
          Dungeon Point System
          <span class="sys-title-deco">✦✦</span>
        </h1>
        <div class="sys3-content-1 sys-content-block sys3-theme" data-anim="slide-top" data-anim-delay="200">
          <div class="sys-content-title-box">Dungeon Info Tab Addition</div>
          <ul class="sys-content-list">
            <li>Dungeon Point info has been added to the top of the Dungeon Info window.</li>
            <li>You can now choose to enter immediately without applying any Dungeon Point settings, directly from the Dungeon Info window.</li>
          </ul>
          <div class="sys-content-image">
            <img :src="isMobile ? 'img/mobile/page/system/3/content_1.png' : 'img/web/page/system/3/content_1.png'" alt="Dungeon Info Tab Addition">
          </div>
        </div>
        <div class="sys3-content-2 sys-content-block sys3-theme" data-anim="slide-top" data-anim-delay="400">
          <div class="sys-content-title-box">Difficulty & Point Settings</div>
          <ul class="sys-content-list">
            <li>When entering a dungeon, you can spend Dungeon Points to apply effects that help your play — stat boosts, travel portals, extra rewards, or special missions.</li>
            <li>Up to 5 effects and 1 mission can be selected.</li>
            <li>Effects and missions cannot be selected at the same time.</li>
            <li>Selected Dungeon Point effects are applied to the dungeon when you enter.</li>
          </ul>
          <div class="sys-content-image">
            <img :src="isMobile ? 'img/mobile/page/system/3/content_2.png' : 'img/web/page/system/3/content_2.png'" alt="Difficulty & Point Settings">
          </div>
        </div>
        <div class="sys3-content-3 sys-content-block sys3-theme" data-anim="slide-top" data-anim-delay="600">
          <div class="sys-content-title-box">Dungeon Missions</div>
          <ul class="sys-content-list">
            <li>After choosing a mission in Dungeon Point settings, on entry you can pick one of 5 mission types.</li>
            <li>While selecting a mission, the character is invulnerable but cannot move.</li>
            <li>When a mission condition is met, the Claim button on the on-screen mini mission window becomes active, letting you click it to receive the reward.</li>
          </ul>
          <div class="sys-content-image">
            <img :src="isMobile ? 'img/mobile/page/system/3/content_3.png' : 'img/web/page/system/3/content_3.png'" alt="Dungeon Missions">
          </div>
        </div>
      </div>
    </section>
  </script>

  <!-- ============================================================
       VUE APP ROOT
       ============================================================ -->
  <div id="app"></div>

  <!-- Vue 2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.min.js"></script>
  <!-- Vue Router 3 CDN (Vue2용) -->
  <script src="https://cdn.jsdelivr.net/npm/vue-router@3.6.5/dist/vue-router.min.js"></script>

  <!-- App JS -->
  <script src="js/app.js"></script>
</body>

</html>
