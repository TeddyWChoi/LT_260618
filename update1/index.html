  <!-- POPUP -->
  <script type="text/x-template" id="tpl-popup">
    <transition name="popup">
      <section
        v-if="popupFlag"
        class="popup-overlay"
        :class="{ 'popup-play': popupPlayFlag }"
        @click.self="closePopup"
      >
        <!-- Image Popup -->
        <template v-if="popupImageFlag">
          <h1 class="hide">View Image</h1>
          <div class="popup-body">
            <button class="popup-close-btn text-hidden" type="button" @click="closePopup">
              <span>Close</span>
            </button>
            <div class="popup-images" :class="popupImageClass && popupImageClass[0]">
              <div class="flicking-viewport">
                <div class="flicking-camera" :style="{ transform: 'translateX(-' + (currentIndex * 100) + '%)' }">
                  <div
                    v-for="(imgClass, idx) in popupImageClass"
                    :key="idx"
                    :class="imgClass"
                    style="flex-shrink:0; width:100%;"
                  ></div>
                </div>
              </div>
              <template v-if="hasMultipleImages">
                <button class="popup-arrow prev text-hidden" type="button" @click="prevImage">
                  <span>Previous</span>
                </button>
                <button class="popup-arrow next text-hidden" type="button" @click="nextImage">
                  <span>Next</span>
                </button>
              </template>
            </div>
          </div>
        </template>
        <!-- Video Popup -->
        <template v-if="popupPlayFlag">
          <h1 class="hide">Watch Video</h1>
          <div class="popup-body">
            <button class="popup-close-btn text-hidden" type="button" @click="closePopup">
              <span>Close</span>
            </button>
            <div class="popup-player" id="youtube-player"></div>
          </div>
        </template>
      </section>
    </transition>
  </script>

  <!-- MAP 1 -->
  <script type="text/x-template" id="tpl-map1-view">
    <div v-if="isMobile" id="map-1-mobile" class="map-view mobile-map-view floating-child">
      <h1 class="title floating">Debesys (Town)</h1>
      <button class="thumbnail floating text-hidden" type="button" @click="openPopup('map-image-1')">Zoom Image</button>
      <div class="text">
        <h2 class="sub-title">A Cloud-Wrapped Village with a Strange Tower</h2>
        <div class="description">
          <p>Long, long ago, in a time no one can recall,<br>people crossed a canyon in search of survival.<br>They climbed endlessly up a hill that seemed to extend beyond the clouds,<br>and at the end of a path that opened between the clouds, they came upon an extraordinary landscape.</p>
          <p>A strange tower crowned with a giant wizard's hat,<br>and an old man wearing the same hat as the tower greeted them.<br>Pitying their plight, the old man let them settle around the tower,<br>and with the help of the old man — who seemed to know every workings of the world —<br>the people built a small village beneath the tower and made it their home.<br>That was the beginning of what is now Debesys.</p>
        </div>
      </div>
      <div class="text">
        <h2 class="sub-title sub-title-2">The Sage's Will</h2>
        <div class="description description-2">
          <p>The old man taught magic to talented children,<br>and just as they grew old enough to lead Debesys, he vanished without a trace.<br>Everyone went out searching for the old man — their benefactor and teacher —<br>but no trace of him could be found anywhere in the world.<br>Following the message the old man had left behind, the village chief opened the tower,<br>and allowed skilled mages to research magic inside it for the people.</p>
          <p>As time passed, people called the vanished old man "The Sage" — the one who brought enlightenment to all — and named his tower "The Sage's Tower."<br>Debesys thus grew into a city of magical research centered on the Sage's Tower, and took its place as a pillar of the Silvaria Empire and the Phreios continent.</p>
        </div>
      </div>
    </div>
    <div v-else id="map-1" class="map-view floating-child">
      <h1 class="map-title floating" data-anim="slide-top" data-anim-delay="0">
        Debesys (Town)
      </h1>
      <button class="map-thumbnail floating text-hidden" type="button" @click="openPopup('map-image-1')">
        Zoom Image
        <span class="map-zoom-btn">
          <span class="icon-zoom"><span></span></span>
        </span>
      </button>
      <h2 class="map-sub-title floating" data-anim="slide-top" data-anim-delay="200">A Cloud-Wrapped Village with a Strange Tower</h2>
      <div class="map-description floating" style="--top: 709px; --left: 944px;">
        <p data-anim="slide-top" data-anim-delay="300">
          Long, long ago, in a time no one can recall, people crossed a canyon in search of survival.<br>
          They climbed endlessly up a hill that seemed to extend beyond the clouds, and at the end of a path that opened between the clouds, they came upon an extraordinary landscape.
        </p>
        <p data-anim="slide-top" data-anim-delay="500">
          A strange tower crowned with a giant wizard's hat, and an old man wearing the same hat as the tower greeted them.<br>
          Pitying their plight, the old man let them settle around the tower,<br>
          and with the help of the old man — who seemed to know every workings of the world —<br>
          the people built a small village beneath the tower and made it their home.<br>
          That was the beginning of what is now Debesys.
        </p>
      </div>
      <h2 class="map-sub-title-2 floating" data-anim="slide-top" data-anim-delay="200">The Sage's Will</h2>
      <div class="map-description-2 floating" style="--top: 709px; --left: 1462px;">
        <p data-anim="slide-top" data-anim-delay="300">
          The old man taught magic to talented children, and just as they grew old enough<br>
          to lead Debesys, he vanished without a trace.<br>
          Everyone went out searching for the old man — their benefactor and teacher —<br>
          but no trace of him could be found anywhere in the world.<br>
          Following the message the old man had left behind, the village chief opened the tower,<br>
          and allowed skilled mages to research magic inside it for the people.
        </p>
        <p data-anim="slide-top" data-anim-delay="500">
          As time passed, people called the vanished old man "The Sage" — the one who brought enlightenment to all —<br>
          and named his tower "The Sage's Tower."<br>
          Debesys thus grew into a city of magical research centered on the Sage's Tower, and<br>
          took its place as a pillar of the Silvaria Empire and the Phreios continent.
        </p>
      </div>
    </div>
  </script>

  <!-- MAP 2 -->
  <script type="text/x-template" id="tpl-map2-view">
    <div v-if="isMobile" id="map-2-mobile" class="map-view mobile-map-view floating-child">
      <h1 class="title floating">Whispering Hill (Field)</h1>
      <button class="thumbnail floating text-hidden" type="button" @click="openPopup('map-2-image-1')">Zoom Image</button>
      <div class="text">
        <h2 class="sub-title">A Breathtaking View</h2>

          <p>As the Sage's Tower of Debesys — a strange village with a strange tower — became widely known,<br>many gathered there, including mages researching magic.<br>The path forward through the dense, view-blocking clouds was not easy,<br>but no one ever complained about the journey.</p>
          <p>People paused on the hill they had climbed to find the tower's location<br>and were captivated by the landscape that opened before them.<br>With clouds spread across their field of view like a horizon,<br>the sight of the strange wizard-hatted tower rising up filled them with awe.<br>Some said it felt as though a god or spirit was whispering a blessing.</p>
          <p data-anim=slide-top data-anim-delay=500>
            Perhaps for that reason, the place once called the Sage's Hill or Debesys Hill<br>naturally came to be known as "Whispering Hill."
          </p>

            <div class="description">
              <p>
                A demon born deep in the abyss who tries to kill anything that lives.<br>
                Its tainted body and tainted magic are so vile that even other demons loathe it.<br>
                When part of the demon world became severely polluted because of Baubad,<br>
                some demons reportedly joined forces and sealed it away.<br>
                However, traces of Baubad were recently discovered inside Rikimo Pelke,<br>
                the very place Belial opened.
              </p>
            </div>
          </div>
        </div>
      </div>

          <div class="nm-image"></div>
          <div class="nm-text">
            <div class="nm-description">
              <p>
                A Strange Bird bearing a large gemstone in its eye.<br>
                Gentle and easygoing by nature, it rarely leaves its nest and won't attack unless provoked.<br>
                But at some point it began flying to Debesys more often, leaving the villagers in unease.<br>
                According to exploration reports, it shares many traits with demonic beasts of the demon world and is<br>
                considered a related species.
              </p>
            </div>
          </div>
        </div>
        <!-- 2. Rock Troll -->
        <div class="normal-monster-item">
          <div class="nm-title" data-anim="slide-right">Rock Troll</div>
          <div class="nm-image"></div>
          <div class="nm-text">
            <div class="nm-description">
              <p>
                A massive monster whose entire body is made of stone, serving as a sentinel of the Nest of the Blind Bird.<br>
                Normally it crouches tightly under a tree without showing its face, looking like an ordinary boulder at first glance.<br>
                But when it senses a scent that doesn't belong near its lair, it reveals the enormous body it has kept hidden.<br>
                It especially hates humans and is said to chase them relentlessly the moment it spots them.<br>
                If you want to survive, never set foot on a path crowded with boulders.
              </p>
            </div>
          </div>
        </div>
        <!-- 3. Debesys Spider -->
        <div class="normal-monster-item">
          <div class="nm-title" data-anim="slide-left">Debesys Spider</div>
          <div class="nm-image"></div>
          <div class="nm-text">
            <div class="nm-description">
              <p>
                A massive spider that inhabits the Nest of the Blind Bird.<br>
                Affected by the magic stones dropped by the Monsterious Jewel Bird, its body has grown larger and its<br>
                appearance has changed considerably.<br>
                It usually keeps itself hidden, but slowly reveals itself when it senses strong magic or energy.<br>
                According to exploration reports, at some point it began capturing humans to feed on their life force.
              </p>
            </div>
          </div>
        </div>
        <!-- 4. Raganaz -->

          <div class="nm-title" data-anim="slide-right">Raganaz</div>
          <div class="nm-image"></div>
          <div class="nm-text">

              <p>
                A forest spirit who seeks to conquer the world with the power that once tended flowers and trees.<br>
                One day she merely fled from an approaching danger, but was cursed and corrupted.<br>
                She withers growing flowers and trees and drives out every living thing dwelling in the forest.<br>
                Based in this corrupted forest, she is plotting to venture out alongside other corrupted beings.
              </p>
            </div>
          </div>
        </div>
        <!-- 5. Zibrina -->
        <div class="normal-monster-item">
          <div class="nm-title" data-anim="slide-left">Ziburina</div>
          <div class="nm-image"></div>
          <div class="nm-text">
            <div class="nm-description">
              <p>
                Once a beautiful spirit who gathered light to bring warmth to the forest.<br>
                When someone offended an ancient god, the entire unrelated forest — though uninvolved — was<br>
                sentenced to annihilation.<br>
                She barely survived by leaning on power flowing from the demon world, but was transformed into a horrifying form<br>
                in return.<br>
                Though she pleaded her grief, no one would listen, claiming she had been tainted by evil. In the end,<br>
                full of seething rage at being rejected, she became an evil spirit who burns life away.
              </p>
            </div>
          </div>
        </div>
        <!-- 6. Bain -->
        <div class="normal-monster-item">
          <div class="nm-title" data-anim="slide-right">Vine</div>
          <div class="nm-image"></div>
          <div class="nm-text">
            <div class="nm-description">
              <p>
                A demon so consumed by combat that it would be no exaggeration to say battle has been his daily life<br>
                from the moment he opened his eyes.<br>
                He once challenged Belial seeking her power, was defeated, and now supports her.<br>
                Thrilled by Belial's mention of someone strong enough to stand against the gods, he tagged along.<br>

        </div>

          <div class="nm-image"></div>
          <div class="nm-text">
            <div class="nm-description">
              <p>

                During a long stay in the forest that once faced annihilation, he lost his demonic nature and came to feel affection<br>
                for nature and life.<br>
                But after meeting Belial again and being scolded harshly that "demons aren't supposed to be like that," he came<br>
                to his senses and started working hard to become a proper "evil demon."<br>
                Not knowing what he should actually be doing, he has thrown himself solely into chasing intruders.
              </p>
            </div>
          </div>
        </div>
        <!-- 8. Baubad -->
        <div class="normal-monster-item">

          <div class="nm-image"></div>

          </div>

  <!-- HISTORY -->
  <script type="text/x-template" id="tpl-history-view">
    <div v-if="isMobile" id="history" class="is-mobile">
      <div class="content">
        <h1 class="hide">Update History</h1>
        <section class="list">
          <ul>
            <li v-for="(data, key) in list" :key="key">
              <a :href="data.url" target="_blank">
                <span class="thumbnail" :style="{ 'background-image': `url(${data.thumbnail})` }"></span>
                <h2 class="title">{{ data.title }}</h2>
              </a>
            </li>
          </ul>
        </section>
        <nav class="paging" v-if="pagingData.page < pagingData.last">
          <button class="view-more" type="button" @click="loadHistory(pagingData.page + 1)">View More</button>
        </nav>
      </div>
    </div>
    <div v-else id="history">
      <div class="history-content">
        <h1 class="history-title">Update <em>History</em></h1>
        <section class="history-list">
          <ul>
            <li v-for="(data, key) in list" :key="key">
              <a :href="data.url" target="_blank">
                <span class="history-thumbnail" :style="{ 'background-image': `url(${data.thumbnail})` }"></span>
                <h2 class="history-item-title">{{ data.title }}</h2>
              </a>
            </li>
          </ul>
        </section>
        <nav class="history-paging">
          <router-link class="text-hidden paging-link shortcut first" :to="{ name: 'history', params: { page: pagingData.first } }">First</router-link>
          <router-link class="text-hidden paging-link shortcut prev" :to="{ name: 'history', params: { page: pagingData.prev } }">Previous</router-link>
          <router-link class="paging-link page" v-for="page in pagingData.end - pagingData.start + 1" :key="page" :class="{ current: (pagingData.start + page - 1) === pagingData.page }" :to="{ name: 'history', params: { page: pagingData.start + page - 1 } }">{{ pagingData.start + page - 1 }}</router-link>
          <router-link class="text-hidden paging-link shortcut next" :to="{ name: 'history', params: { page: pagingData.next } }">Next</router-link>
          <router-link class="text-hidden paging-link shortcut last" :to="{ name: 'history', params: { page: pagingData.last } }">Last</router-link>
        </nav>
      </div>
    </div>
  </script>
