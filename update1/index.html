  <!-- POPUP -->
  <script type="text/x-template" id="tpl-popup">
    <transition name="popup">
      <section
        v-if="popupFlag"
        class="popup-overlay"
        :class="{ 'popup-play': popupPlayFlag }"
        @click.self="closePopup"
      >
        <!-- Image Popup -->
        <template v-if="popupImageFlag">
          <h1 class="hide">View Image</h1>
          <div class="popup-body">
            <button class="popup-close-btn text-hidden" type="button" @click="closePopup">
              <span>Close</span>
            </button>
            <div class="popup-images" :class="popupImageClass && popupImageClass[0]">
              <div class="flicking-viewport">
                <div class="flicking-camera" :style="{ transform: 'translateX(-' + (currentIndex * 100) + '%)' }">
                  <div
                    v-for="(imgClass, idx) in popupImageClass"
                    :key="idx"
                    :class="imgClass"
                    style="flex-shrink:0; width:100%;"
                  ></div>
                </div>
              </div>
              <template v-if="hasMultipleImages">
                <button class="popup-arrow prev text-hidden" type="button" @click="prevImage">
                  <span>Prev</span>
                </button>
                <button class="popup-arrow next text-hidden" type="button" @click="nextImage">
                  <span>Next</span>
                </button>
              </template>
            </div>
          </div>
        </template>
        <!-- Video Popup -->
        <template v-if="popupPlayFlag">
          <h1 class="hide">Watch Video</h1>
          <div class="popup-body">
            <button class="popup-close-btn text-hidden" type="button" @click="closePopup">
              <span>Close</span>
            </button>
            <div class="popup-player" id="youtube-player"></div>
          </div>
        </template>
      </section>
    </transition>
  </script>

  <!-- MAP 1 -->
  <script type="text/x-template" id="tpl-map1-view">
    <div v-if="isMobile" id="map-1-mobile" class="map-view mobile-map-view floating-child">
      <h1 class="title floating">Debesys (Town)</h1>
      <button class="thumbnail floating text-hidden" type="button" @click="openPopup('map-image-1')">Zoom Image</button>
      <div class="text">
        <h2 class="sub-title">A Village in the Clouds with a Strange Tower</h2>
        <div class="description">
          <p>A long, long time ago, so distant that no one remembers,<br>there were people who crossed the canyon to survive.<br>Those who climbed endlessly up the hill where only clouds were visible<br>faced an exotic landscape at the end of the road that opened between the clouds.</p>
          <p>A strange tower topped with a large wizard hat,<br>and an old man wearing a hat just like the tower greeted them.<br>Feeling sorry for their plight, the old man allowed them to stay near the tower,<br>and with the help of the old man, who seemed to know all the principles of the world,<br>the people built a small village under the tower and settled down.<br>That was the beginning of what is now Debesys.</p>
        </div>
      </div>
      <div class="text">
        <h2 class="sub-title sub-title-2">The Will of the Sage</h2>
        <div class="description description-2">
          <p>The old man taught magic to talented children,<br>and disappeared suddenly when the children grew up enough to lead Debesys.<br>Everyone set out to find the old man, who was both their benefactor and teacher, but<br>his traces could not be found anywhere in the world.<br>The village chief, who led the village at the time, opened the tower according to the message left by the old man,<br>allowing competent wizards to study magic inside it for the people.</p>
          <p>As time passed, people called the vanished old man the 'Sage' who enlightened everyone, and named his tower the 'Sage's Tower.'<br>In this way, Debesys developed into a magic research city centered around the Sage's Tower, and established itself as a key pillar of the Silvaria Empire as well as the continent of Freios.</p>
        </div>
      </div>
    </div>
    <div v-else id="map-1" class="map-view floating-child">
      <h1 class="map-title floating" data-anim="slide-top" data-anim-delay="0">
        Debesys (Town)
      </h1>
      <button class="map-thumbnail floating text-hidden" type="button" @click="openPopup('map-image-1')">
        Zoom Image
        <span class="map-zoom-btn">
          <span class="icon-zoom"><span></span></span>
        </span>
      </button>
      <h2 class="map-sub-title floating" data-anim="slide-top" data-anim-delay="200">A Village in the Clouds with a Strange Tower</h2>
      <div class="map-description floating" style="--top: 709px; --left: 944px;">
        <p data-anim="slide-top" data-anim-delay="300">
          A long, long time ago, so distant that no one remembers, there were people who crossed the canyon to survive.<br>
          Those who climbed endlessly up the hill where only clouds were visible faced an exotic landscape at the end of the road that opened between the clouds.
        </p>
        <p data-anim="slide-top" data-anim-delay="500">
          A strange tower topped with a large wizard hat, and an old man wearing a hat just like the tower greeted them.<br>
          Feeling sorry for their plight, the old man allowed them to stay near the tower,<br>
          and with the help of the old man, who seemed to know all the principles of the world,<br>
          the people built a small village under the tower and settled down.<br>
          That was the beginning of what is now Debesys.
        </p>
      </div>
      <h2 class="map-sub-title-2 floating" data-anim="slide-top" data-anim-delay="200">The Will of the Sage</h2>
      <div class="map-description-2 floating" style="--top: 709px; --left: 1462px;">
        <p data-anim="slide-top" data-anim-delay="300">
          The old man taught magic to talented children, and disappeared suddenly when the children<br>
          grew up enough to lead Debesys.<br>
          Everyone set out to find the old man, who was both their benefactor and teacher, but<br>
          his traces could not be found anywhere in the world.<br>
          The village chief, who led the village at the time, opened the tower according to the message left by the old man,<br>
          allowing competent wizards to study magic inside it for the people.
        </p>
        <p data-anim="slide-top" data-anim-delay="500">
          As time passed, people called the vanished old man the 'Sage' who enlightened everyone,<br>
          and named his tower the 'Sage's Tower.'<br>
          In this way, Debesys developed into a magic research city centered around the Sage's Tower, and<br>
          established itself as a key pillar of the Silvaria Empire as well as the continent of Freios.
        </p>
      </div>
    </div>
  </script>

  <!-- MAP 2 -->
  <script type="text/x-template" id="tpl-map2-view">
    <div v-if="isMobile" id="map-2-mobile" class="map-view mobile-map-view floating-child">
      <h1 class="title floating">Whispering Hill (Field)</h1>
      <button class="thumbnail floating text-hidden" type="button" @click="openPopup('map-2-image-1')">Zoom Image</button>
      <div class="text">
        <h2 class="sub-title">A Breath-taking View</h2>
        <div class="description">
          <p>As the 'Sage's Tower' of Debesys, a strange village with a strange tower, became widely known,<br>many people gathered, including wizards studying magic.<br>The path forward through the dense clouds that blocked the view was not easy,<br>but no one ever complained about the journey.</p>
          <p>People stopped their steps on the hill they climbed to find the location of the tower<br>and were captivated by the scenery before their eyes.<br>With the clouds filling the view spreading out like a horizon,<br>the sight of the strange tower with the wizard hat rising was somehow awe-inspiring.<br>Some said it was as if a god or a spirit was whispering a message of blessing.</p>
          <p data-anim=slide-top data-anim-delay=500>
            Perhaps because of this, the place, which used to be called Sage's Hill or Debesys Hill,<br>naturally came to be called 'Whispering Hill'.
          </p>
        </div>
      </div>
    </div>
    <div v-else id="map-2" class="map-view floating-child">

  <!-- HISTORY -->
  <script type="text/x-template" id="tpl-history-view">
    <div v-if="isMobile" id="history" class="is-mobile">
      <div class="content">
        <h1 class="hide">Update history</h1>
        <section class="list">
          <ul>
            <li v-for="(data, key) in list" :key="key">
              <a :href="data.url" target="_blank">
                <span class="thumbnail" :style="{ 'background-image': `url(${data.thumbnail})` }"></span>
                <h2 class="title">{{ data.title }}</h2>
              </a>
            </li>
          </ul>
        </section>
        <nav class="paging" v-if="pagingData.page < pagingData.last">
          <button class="view-more" type="button" @click="loadHistory(pagingData.page + 1)">View More</button>
        </nav>
      </div>
    </div>
    <div v-else id="history">
      <div class="history-content">
        <h1 class="history-title">Update <em>history</em></h1>
        <section class="history-list">
          <ul>
            <li v-for="(data, key) in list" :key="key">
              <a :href="data.url" target="_blank">
                <span class="history-thumbnail" :style="{ 'background-image': `url(${data.thumbnail})` }"></span>
                <h2 class="history-item-title">{{ data.title }}</h2>
              </a>
            </li>
          </ul>
        </section>
        <nav class="history-paging">
          <router-link class="text-hidden paging-link shortcut first" :to="{ name: 'history', params: { page: pagingData.first } }">First</router-link>
          <router-link class="text-hidden paging-link shortcut prev" :to="{ name: 'history', params: { page: pagingData.prev } }">Prev</router-link>
          <router-link class="paging-link page" v-for="page in pagingData.end - pagingData.start + 1" :key="page" :class="{ current: (pagingData.start + page - 1) === pagingData.page }" :to="{ name: 'history', params: { page: pagingData.start + page - 1 } }">{{ pagingData.start + page - 1 }}</router-link>
          <router-link class="text-hidden paging-link shortcut next" :to="{ name: 'history', params: { page: pagingData.next } }">Next</router-link>
          <router-link class="text-hidden paging-link shortcut last" :to="{ name: 'history', params: { page: pagingData.last } }">Last</router-link>
        </nav>
      </div>
    </div>
  </script>
